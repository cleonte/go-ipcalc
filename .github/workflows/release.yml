name: release

# Pushing a tag vX.Y.Z builds the binaries and packages with GoReleaser and
# publishes a release. Running the workflow by hand builds a snapshot without
# publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # the latest patch release, not the go.mod minimum
          go-version: '1.27.x'
      - name: release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # the notes are the NEWS entry of the version
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0,"* go-ipcalc " v " ")==1 {p=1; next} /^[*] / {p=0} p' NEWS > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/v') && format('release --clean --release-notes={0}/notes.md', runner.temp) || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: dist
          path: dist/*

  # Updates the formula in the tap cleonte/homebrew-tap. The GITHUB_TOKEN of a
  # workflow cannot push to another repository, so this needs the repository
  # secret HOMEBREW_TAP_TOKEN (a token with write access to the tap only). Without
  # the secret the job is skipped.
  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: check for the token
        run: |
          [ -n "$HOMEBREW_TAP_TOKEN" ] || echo "HOMEBREW_TAP_TOKEN is not set: tap not updated" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: env.HOMEBREW_TAP_TOKEN != ''
      - name: update the formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -O "$RUNNER_TEMP/SHA256SUMS"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/cleonte/homebrew-tap.git" "$RUNNER_TEMP/tap"
          packaging/homebrew/render.sh "$version" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/tap/Formula/go-ipcalc.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/go-ipcalc.rb
          git diff --cached --quiet && exit 0
          git commit -m "Brew formula update for go-ipcalc version $GITHUB_REF_NAME"
          git push
