name: test

# GitHub is a read-only mirror of https://gitlab.com/ipcalc/go-ipcalc. The
# GitLab pipeline runs everything else; this job only adds macOS.
on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: go test ./...
