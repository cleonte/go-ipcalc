# GitLab is the primary repository; GitHub is a push mirror that only runs a
# macOS test job (.github/workflows/test.yml).

stages:
  - test
  - release
  - publish

workflow:
  rules:
    # merge request pipelines, and no duplicate branch pipeline while an MR is open
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  GOPATH: $CI_PROJECT_DIR/.cache/go
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go/pkg/mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

secret_detection:
  stage: test

.go-cache:
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go/pkg/mod/
      - .cache/go-build/

.checks-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:linux:
  extends: [.go-cache, .checks-rules]
  stage: test
  image: golang:1.27
  script:
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+(?:\.\d+)?)%/'

# the oldest Go that go.mod allows
test:min-go:
  extends: [.go-cache, .checks-rules]
  stage: test
  image: golang:1.27.0
  script:
    - go test ./...

test:windows:
  extends: .checks-rules
  stage: test
  tags: [saas-windows-medium-amd64]
  variables:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: core.autocrlf
    GIT_CONFIG_VALUE_0: "false"
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $ProgressPreference = 'SilentlyContinue'
      $releases = Invoke-RestMethod 'https://go.dev/dl/?mode=json'
      $rel = $releases | Where-Object { $_.stable -and $_.version -like 'go1.27.*' } | Select-Object -First 1
      $file = $rel.files | Where-Object { $_.os -eq 'windows' -and $_.arch -eq 'amd64' -and $_.kind -eq 'archive' } | Select-Object -First 1
      Write-Host "Installing $($rel.version)"
      Invoke-WebRequest "https://go.dev/dl/$($file.filename)" -OutFile go.zip
      $hash = (Get-FileHash go.zip -Algorithm SHA256).Hash
      if ($hash -ne $file.sha256) { throw "checksum mismatch for $($file.filename)" }
      Expand-Archive go.zip -DestinationPath "$env:TEMP\goroot"
      $env:PATH = "$env:TEMP\goroot\go\bin;$env:PATH"
      go version
      go test ./...
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

lint:
  extends: [.go-cache, .checks-rules]
  stage: test
  image: golangci/golangci-lint:v2.15.0
  script:
    - golangci-lint run

govulncheck:
  extends: [.go-cache, .checks-rules]
  stage: test
  image: golang:1.27
  script:
    - go tool govulncheck ./...

generate:
  extends: [.go-cache, .checks-rules]
  stage: test
  image: golang:1.27
  script:
    - go generate ./...
    - git diff --exit-code

# Pushing a protected tag vX.Y.Z builds the binaries and packages with
# GoReleaser and publishes a GitLab release. GITLAB_TOKEN is the job token
# (gitlab_urls.use_job_token in .goreleaser.yaml); it uploads the assets to the
# project's generic package registry. GoReleaser is run with go run, so the Go
# version is the one of the golang image.
release:
  stage: release
  extends: .go-cache
  image: golang:1.27
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    GIT_DEPTH: "0"
    GITLAB_TOKEN: $CI_JOB_TOKEN
    RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  script:
    - |
      # the notes are the NEWS entry of the version
      awk -v v="${CI_COMMIT_TAG#v}" 'index($0,"* go-ipcalc " v " ")==1 {p=1; next} /^[*] / {p=0} p' NEWS > /tmp/notes.md
    - test -s /tmp/notes.md
    - go run github.com/goreleaser/goreleaser/v2@v2.20.2 release --clean --release-notes=/tmp/notes.md
  artifacts:
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/*.deb
      - dist/*.rpm
      - dist/*.apk
      - dist/SHA256SUMS

# Updates the formula in the tap cleonte/homebrew-tap on GitHub. Needs the
# masked, protected CI/CD variable HOMEBREW_TAP_TOKEN (a token that can push to
# the tap only); without it the job is skipped.
homebrew:
  stage: publish
  image: alpine:3.22
  needs:
    - job: release
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $HOMEBREW_TAP_TOKEN
  before_script:
    - apk add --no-cache bash git curl
  script:
    - version=${CI_COMMIT_TAG#v}
    - git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/cleonte/homebrew-tap.git" /tmp/tap
    - packaging/homebrew/render.sh "$version" dist/SHA256SUMS > /tmp/tap/Formula/go-ipcalc.rb
    - cd /tmp/tap
    - git config user.name "github-actions[bot]"
    - git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - git add Formula/go-ipcalc.rb
    - git diff --cached --quiet && exit 0
    - git commit -m "Brew formula update for go-ipcalc version $CI_COMMIT_TAG"
    - git push
