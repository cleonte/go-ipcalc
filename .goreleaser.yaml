version: 2

project_name: ipcalc

builds:
  - main: ./cmd/ipcalc
    binary: ipcalc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X gitlab.com/ipcalc/go-ipcalc/internal/ipcalc.version={{.Version}}
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - freebsd_amd64
      - windows_amd64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - COPYING
      - README.md
      - NEWS
      - src: man/ipcalc.1
        dst: .
        strip_parent: true

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# The distribution packages are named go-ipcalc and conflict with the distro's
# ipcalc package, which owns /usr/bin/ipcalc.
nfpms:
  - id: packages
    package_name: go-ipcalc
    ids: [ipcalc]
    formats: [deb, rpm, apk]
    maintainer: "Cristian Leonte <544271+cleonte@users.noreply.github.com>"
    homepage: https://gitlab.com/ipcalc/go-ipcalc
    license: GPL-2.0-only
    description: IPv4/IPv6 network calculator, a Go port of ipcalc
    bindir: /usr/bin
    conflicts:
      - ipcalc
    contents:
      - src: man/ipcalc.1
        dst: /usr/share/man/man1/ipcalc.1
      - src: COPYING
        dst: /usr/share/doc/go-ipcalc/COPYING

# The release notes are the NEWS entry of the version (--release-notes). The
# changelog must not be disabled: that skips the pipe that reads the notes
# file, and the release body comes out empty.
changelog:
  use: git

# The release assets are uploaded to the project's generic package registry
# (packages/generic/ipcalc/<version>/<file>) and linked from the release. In CI
# GITLAB_TOKEN is CI_JOB_TOKEN, which use_job_token tells GoReleaser about.
gitlab_urls:
  use_job_token: true
  use_package_registry: true

release:
  gitlab:
    owner: ipcalc
    name: go-ipcalc
  draft: false
  mode: replace
